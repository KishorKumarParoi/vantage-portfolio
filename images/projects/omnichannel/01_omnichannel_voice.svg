    <text x="15" y="48" fill="#94a3b8" font-size="11">Marcus ↔ Sophia Warm Transfer Handoffs</text>
    <text x="15" y="64" fill="#94a3b8" font-size="11">Multi-Region Dialect &amp; Barge-in Handling</text>
    <text x="15" y="78" fill="#34d399" font-size="10">Inbound PSTN + Outbound "Call Me" Flow</text>
