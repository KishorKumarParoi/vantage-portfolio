    <text x="15" y="48" fill="#fdba74" font-size="11">check_availability(service, date, stylist)</text>
    <text x="15" y="68" fill="#cbd5e1" font-size="11">book_appointment(client, phone, time)</text>
    <text x="15" y="86" fill="#34d399" font-size="10">FastAPI Mid-Call Tool Execution (&lt;40ms)</text>
