<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="vapiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="n8nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="crmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Title Badge -->
  <rect x="40" y="25" width="920" height="55" rx="8" fill="#131b2e" stroke="#1e293b" stroke-width="1.5"/>
  <text x="60" y="58" fill="#f43f5e" font-size="18" font-weight="700">💇‍♀️ Omnichannel AI Voice &amp; Chat Receptionist Platform (Vapi + n8n)</text>
  <text x="650" y="58" fill="#94a3b8" font-size="13">Sub-600ms Conversational Turnaround • Twilio SMS</text>

  <!-- Telephony & Voice Audio Ingestion -->
  <rect x="40" y="105" width="280" height="460" rx="10" fill="url(#vapiGrad)" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="60" y="135" fill="#fb7185" font-size="15" font-weight="700">Voice Telephony &amp; STT/TTS</text>
  <text x="60" y="155" fill="#fda4af" font-size="12">SIP / Twilio Trunk • WebRTC Stream</text>

  <g transform="translate(60, 180)">
    <rect width="240" height="75" rx="6" fill="#1e1b4b" stroke="#f43f5e" stroke-width="1"/>
    <text x="15" y="28" fill="#fecdd3" font-size="13" font-weight="600">Deepgram Nova-2 STT</text>
    <text x="15" y="48" fill="#94a3b8" font-size="11">Latency: &lt;200ms Word Error Rate 4.1%</text>
    <text x="15" y="64" fill="#38bdf8" font-size="10">Streaming WebSocket Audio Transcription</text>
  </g>

  <g transform="translate(60, 270)">
    <rect width="240" height="85" rx="6" fill="#1e1b4b" stroke="#f43f5e" stroke-width="1"/>
    <text x="15" y="28" fill="#fecdd3" font-size="13" font-weight="600">Vapi Voice Orchestrator</text>
    <text x="15" y="48" fill="#94a3b8" font-size="11">Interruptible Speech Detection (Barge-in)</text>
    <text x="15" y="64" fill="#94a3b8" font-size="11">System Prompt &amp; Salon Knowledge Base</text>
    <text x="15" y="78" fill="#34d399" font-size="10">Sub-second Turn Execution</text>
  </g>

  <g transform="translate(60, 370)">
    <rect width="240" height="80" rx="6" fill="#1e1b4b" stroke="#f43f5e" stroke-width="1"/>
    <text x="15" y="28" fill="#fecdd3" font-size="13" font-weight="600">Cartesia Sonic TTS</text>
    <text x="15" y="48" fill="#94a3b8" font-size="11">Latency: &lt;120ms Natural Human Voice</text>
    <text x="15" y="66" fill="#cbd5e1" font-size="10">Emotion-adaptive tone &amp; prosody</text>
  </g>

  <!-- Middle: Webhook & Slot Calculation Engine -->
  <rect x="345" y="105" width="310" height="460" rx="10" fill="url(#n8nGrad)" stroke="#f97316" stroke-width="1.5"/>
  <text x="365" y="135" fill="#fb923c" font-size="15" font-weight="700">FastAPI &amp; n8n Automation Engine</text>
  <text x="365" y="155" fill="#fdba74" font-size="12">Mid-Call Tool Calling • Dynamic Slot Math</text>

  <g transform="translate(365, 180)">
    <rect width="270" height="100" rx="6" fill="#2d1305" stroke="#f97316" stroke-width="1"/>
    <text x="15" y="28" fill="#fed7aa" font-size="13" font-weight="600">POST /webhook/vapi-tools</text>
    <text x="15" y="48" fill="#fdba74" font-size="11">check_availability(service, date, stylist)</text>
    <text x="15" y="68" fill="#cbd5e1" font-size="11">book_appointment(client, phone, time)</text>
    <text x="15" y="86" fill="#34d399" font-size="10">HMAC-SHA256 Payload Signature Check</text>
  </g>

  <g transform="translate(365, 295)">
    <rect width="270" height="120" rx="6" fill="#2d1305" stroke="#f97316" stroke-width="1"/>
    <text x="15" y="26" fill="#fed7aa" font-size="12" font-weight="700">Dynamic Slot Calculation Math</text>
    <text x="15" y="46" fill="#fdba74" font-size="11">• Balayage: 150-min block allocation</text>
    <text x="15" y="64" fill="#fdba74" font-size="11">• Blowout &amp; Cut: 45-min block allocation</text>
    <text x="15" y="82" fill="#cbd5e1" font-size="11">• Stylist calendar intersection algorithm</text>
    <text x="15" y="102" fill="#34d399" font-size="10">Zero double-booking guarantee</text>
  </g>

  <g transform="translate(365, 430)">
    <rect width="270" height="110" rx="6" fill="#2d1305" stroke="#fb923c" stroke-width="1"/>
    <text x="15" y="26" fill="#fed7aa" font-size="12" font-weight="700">Cloudflare Tunnel Bridge</text>
    <text x="15" y="46" fill="#cbd5e1" font-size="11">Encrypted HTTPS edge to local server</text>
    <text x="15" y="64" fill="#cbd5e1" font-size="11">Automatic assistant_config.json update</text>
    <text x="15" y="84" fill="#38bdf8" font-size="10">Single-command: ./run_live_tunnel.sh</text>
  </g>

  <!-- Right: Twilio SMS, Calendar & CRM -->
  <rect x="680" y="105" width="280" height="460" rx="10" fill="url(#crmGrad)" stroke="#10b981" stroke-width="1.5"/>
  <text x="700" y="135" fill="#34d399" font-size="15" font-weight="700">Multi-Channel Delivery &amp; CRM</text>
  <text x="700" y="155" fill="#6ee7b7" font-size="12">Twilio SMS • Google Calendar • CRM</text>

  <g transform="translate(700, 180)">
    <rect width="240" height="95" rx="6" fill="#062e22" stroke="#10b981" stroke-width="1"/>
    <text x="15" y="26" fill="#a7f3d0" font-size="12" font-weight="700">Twilio SMS Confirmation</text>
    <text x="15" y="44" fill="#6ee7b7" font-size="11">Dispatches instant booking SMS with:</text>
    <text x="15" y="62" fill="#cbd5e1" font-size="11">• Appointment reference &amp; time</text>
    <text x="15" y="78" fill="#34d399" font-size="10">• Dynamic 1-click Reschedule Token</text>
  </g>

  <g transform="translate(700, 290)">
    <rect width="240" height="95" rx="6" fill="#062e22" stroke="#10b981" stroke-width="1"/>
    <text x="15" y="26" fill="#a7f3d0" font-size="12" font-weight="700">Calendar &amp; Salon DB</text>
    <text x="15" y="44" fill="#6ee7b7" font-size="11">Google Calendar API v3 two-way sync</text>
    <text x="15" y="62" fill="#cbd5e1" font-size="11">PostgreSQL Booking Ledger &amp; Logs</text>
    <text x="15" y="80" fill="#38bdf8" font-size="10">Sub-5ms indexed slot lookup</text>
  </g>

  <g transform="translate(700, 400)">
    <rect width="240" height="140" rx="6" fill="#062e22" stroke="#34d399" stroke-width="1.5"/>
    <text x="15" y="26" fill="#a7f3d0" font-size="13" font-weight="700">Business Impact Metric</text>
    <text x="15" y="48" fill="#6ee7b7" font-size="11">• Missed Appointment Drop: -74%</text>
    <text x="15" y="68" fill="#6ee7b7" font-size="11">• Turnaround Latency: &lt;600ms</text>
    <text x="15" y="88" fill="#fbbf24" font-size="11">• Revenue Preserved: $420K/yr</text>
    <text x="15" y="108" fill="#cbd5e1" font-size="11">• Concurrent Calls: 10,000+</text>
    <text x="15" y="126" fill="#38bdf8" font-size="10">Deterministic $0.00 Teardown</text>
  </g>
</svg>
