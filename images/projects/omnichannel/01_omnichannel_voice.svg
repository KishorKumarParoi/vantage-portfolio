    <text x="14" y="62" fill="#cbd5e1" font-size="10.2">Pooled Neon PG + SQLite local fallback</text>
    <text x="14" y="80" fill="#38bdf8" font-size="10">Clerk multi-tenant onboarding &amp; CRM sync</text>
  </g>

  <g transform="translate(700, 400)">
