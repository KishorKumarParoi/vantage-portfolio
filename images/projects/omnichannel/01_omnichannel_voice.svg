    <text x="15" y="68" fill="#6ee7b7" font-size="11">• STT / FastAPI / TTS: 180 / 40 / 110ms</text>
    <text x="15" y="88" fill="#fbbf24" font-size="11">• 8+ Voice &amp; Chat Channels Live</text>
    <text x="15" y="108" fill="#cbd5e1" font-size="11">• 30-Day Cold-Mail Retention Flow</text>
    <text x="15" y="126" fill="#38bdf8" font-size="10">ai-voice-receptionist.kishor.tech</text>
