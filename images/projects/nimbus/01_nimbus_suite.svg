    <text x="15" y="30" fill="#e9d5ff" font-size="14" font-weight="700">1. Meeting Agent</text>
    <text x="15" y="48" fill="#c084fc" font-size="11">meeting.kishor.tech</text>
    <rect x="15" y="65" width="140" height="380" rx="6" fill="#0f0c29" stroke="#6d28d9" stroke-width="1"/>
    <text x="25" y="90" fill="#e2e8f0" font-size="11" font-weight="600">• Live Meeting Scribe</text>
    <text x="25" y="115" fill="#cbd5e1" font-size="10">• Action Item Extraction</text>
    <text x="25" y="135" fill="#cbd5e1" font-size="10">• Minutes Generation</text>
    <text x="25" y="155" fill="#cbd5e1" font-size="10">• Decision Context RAG</text>
    <text x="25" y="180" fill="#38bdf8" font-size="10">&lt;400ms Voice Roundtrip</text>
