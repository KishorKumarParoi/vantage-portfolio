<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="nimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Title Badge -->
  <rect x="40" y="25" width="920" height="55" rx="8" fill="#131b2e" stroke="#1e293b" stroke-width="1.5"/>
  <text x="60" y="58" fill="#c084fc" font-size="18" font-weight="700">🎙️ Nimbus-AI Suite: Enterprise 5-Agent Conversational Voice Copilot Ecosystem</text>
  <text x="670" y="58" fill="#94a3b8" font-size="13">WebRTC Low Latency • FastMCP Integrations</text>

  <!-- 5 Voice Agent Columns -->
  <!-- Agent 1: Meeting Copilot -->
  <g transform="translate(40, 105)">
    <rect width="170" height="460" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="15" y="30" fill="#e9d5ff" font-size="14" font-weight="700">1. Meeting Copilot</text>
    <text x="15" y="48" fill="#c084fc" font-size="11">Real-Time Transcription</text>
    <rect x="15" y="65" width="140" height="380" rx="6" fill="#0f0c29" stroke="#6d28d9" stroke-width="1"/>
    <text x="25" y="90" fill="#e2e8f0" font-size="11" font-weight="600">• Live Summaries</text>
    <text x="25" y="115" fill="#cbd5e1" font-size="10">• Action Item Extraction</text>
    <text x="25" y="135" fill="#cbd5e1" font-size="10">• Speaker Diarization</text>
    <text x="25" y="155" fill="#cbd5e1" font-size="10">• Notion &amp; Slack Sync</text>
    <text x="25" y="180" fill="#38bdf8" font-size="10">&lt;500ms Audio Buffering</text>
  </g>

  <!-- Agent 2: Sales Discovery -->
  <g transform="translate(225, 105)">
    <rect width="170" height="460" rx="8" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="15" y="30" fill="#fbcfe8" font-size="14" font-weight="700">2. Sales Discovery</text>
    <text x="15" y="48" fill="#f472b6" font-size="11">Lead Qualification</text>
    <rect x="15" y="65" width="140" height="380" rx="6" fill="#0f0c29" stroke="#be185d" stroke-width="1"/>
    <text x="25" y="90" fill="#e2e8f0" font-size="11" font-weight="600">• BANT Qualification</text>
    <text x="25" y="115" fill="#cbd5e1" font-size="10">• Objection Handling</text>
    <text x="25" y="135" fill="#cbd5e1" font-size="10">• Salesforce CRM push</text>
    <text x="25" y="155" fill="#cbd5e1" font-size="10">• Real-Time Battlecards</text>
    <text x="25" y="180" fill="#f43f5e" font-size="10">+34% Close Velocity</text>
  </g>

  <!-- Agent 3: Research Assistant -->
  <g transform="translate(410, 105)">
    <rect width="170" height="460" rx="8" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="15" y="30" fill="#bfdbfe" font-size="14" font-weight="700">3. Research Voice</text>
    <text x="15" y="48" fill="#60a5fa" font-size="11">Perplexity-Style Agent</text>
    <rect x="15" y="65" width="140" height="380" rx="6" fill="#0f0c29" stroke="#1d4ed8" stroke-width="1"/>
    <text x="25" y="90" fill="#e2e8f0" font-size="11" font-weight="600">• Multi-Hop Web Search</text>
    <text x="25" y="115" fill="#cbd5e1" font-size="10">• ArXiv &amp; SEC Filing Tool</text>
    <text x="25" y="135" fill="#cbd5e1" font-size="10">• Spoken Citations</text>
    <text x="25" y="155" fill="#cbd5e1" font-size="10">• Fact-Checking Gating</text>
    <text x="25" y="180" fill="#38bdf8" font-size="10">Sub-second citations</text>
  </g>

  <!-- Agent 4: Scheduling Copilot -->
  <g transform="translate(595, 105)">
    <rect width="170" height="460" rx="8" fill="#1e1b4b" stroke="#10b981" stroke-width="1.5"/>
    <text x="15" y="30" fill="#a7f3d0" font-size="14" font-weight="700">4. Scheduling Copilot</text>
    <text x="15" y="48" fill="#34d399" font-size="11">Calendar Negotiation</text>
    <rect x="15" y="65" width="140" height="380" rx="6" fill="#0f0c29" stroke="#047857" stroke-width="1"/>
    <text x="25" y="90" fill="#e2e8f0" font-size="11" font-weight="600">• GCal &amp; Outlook API</text>
    <text x="25" y="115" fill="#cbd5e1" font-size="10">• Time Zone Conversion</text>
    <text x="25" y="135" fill="#cbd5e1" font-size="10">• Conflict Resolution</text>
    <text x="25" y="155" fill="#cbd5e1" font-size="10">• Email Invites</text>
    <text x="25" y="180" fill="#34d399" font-size="10">Zero Double-Booking</text>
  </g>

  <!-- Agent 5: Desktop Controller -->
  <g transform="translate(780, 105)">
    <rect width="180" height="460" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="15" y="30" fill="#fde68a" font-size="14" font-weight="700">5. Desktop Voice</text>
    <text x="15" y="48" fill="#fbbf24" font-size="11">Hands-Free Automation</text>
    <rect x="15" y="65" width="150" height="380" rx="6" fill="#0f0c29" stroke="#b45309" stroke-width="1"/>
    <text x="25" y="90" fill="#e2e8f0" font-size="11" font-weight="600">• App Window Control</text>
    <text x="25" y="115" fill="#cbd5e1" font-size="10">• Terminal Command Voice</text>
    <text x="25" y="135" fill="#cbd5e1" font-size="10">• System Audio Control</text>
    <text x="25" y="155" fill="#cbd5e1" font-size="10">• FastMCP System Tools</text>
    <text x="25" y="180" fill="#fbbf24" font-size="10">Sub-150ms IPC Latency</text>
  </g>
</svg>

